name: Base64 bridge

on:
  push:
    branches:
      - main
  pull_request:

# The workflows only read the repository; nothing needs a write-capable GITHUB_TOKEN.
permissions:
  contents: read

# Cancels all previous workflow runs for pull requests that have not completed.
concurrency:
  # The concurrency group contains the workflow name and the branch name for pull requests
  # or the commit hash for any other events.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

# docs/base64-uploads.md tells a caller to write a bridge, so that code has to keep working.
# This runs the page's own snippets — read out of the Markdown, not copied — against the
# library. A base64 payload is a string in the request body, so unlike the PSR-7 bridge there is
# no third-party implementation to run it against and the check needs no manifest of its own.
jobs:
  run:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The ends of the supported range: the documented code has to run on both
        php: [ '7.3', '8.5' ]

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.0

      - name: Install PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.35.5
        with:
          php-version: ${{ matrix.php }}

      # The autoloader the check runs under is the one a consumer gets
      - name: Install the library
        run: composer install --no-dev --no-interaction --no-progress

      - name: Run the documented base64 bridge
        run: composer base64-docs
